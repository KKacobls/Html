<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discord AI Bot · 管理後台</title>
<style>
:root{font-family:Inter,"Noto Sans TC",system-ui,-apple-system,sans-serif;color-scheme:dark;background:#10131b;color:#e8eaf3}*{box-sizing:border-box}body{margin:0}.shell{max-width:940px;margin:0 auto;padding:32px 20px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:14px}.logo{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(130deg,#7289ff,#6046c3);font-size:25px;box-shadow:0 10px 35px #5963f534}.eyebrow{color:#9eabc9;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}.brand h1{margin:4px 0 0;font-size:25px;letter-spacing:-.04em}.status{display:flex;gap:9px;flex-wrap:wrap}.pill{padding:8px 11px;background:#1d2432;border:1px solid #343d52;border-radius:99px;color:#c5cde0;font-size:13px}.pill.good::before{content:'●';color:#67d6ac;margin-right:7px}.pill.bad::before{content:'●';color:#e5ad67;margin-right:7px}.hero{padding:26px 28px;border:1px solid #343e5c;background:linear-gradient(110deg,#243055,#181e33 70%);border-radius:20px;margin-bottom:24px}.hero h2{font-size:22px;margin:0 0 9px}.hero p{margin:0;color:#c4cce2;line-height:1.7}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:30px 0 13px}.sectionTitle h2{font-size:17px;margin:0}.muted{color:#9eabc3;font-size:13px}.btn{cursor:pointer;border-radius:10px;border:1px solid #425072;background:#293348;color:#e5eafa;padding:10px 16px;font-size:14px;font-weight:600}.btn:hover{filter:brightness(1.15)}.btn.primary{background:#6479ef;border:1px solid #6479ef;color:white}.btn:disabled{opacity:.5;cursor:default}.panel{background:#191f2d;border:1px solid #313b4e;border-radius:16px;padding:23px;margin-bottom:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.guildname{font-size:18px;font-weight:700}.sub{color:#9da9c2;font-size:12px;margin-top:5px}.formrow{margin-top:20px;display:grid;grid-template-columns:minmax(180px,1fr) 145px;gap:18px}.field{display:flex;flex-direction:column;gap:8px;font-size:13px;color:#adb8d0;font-weight:600}select,input[type=number]{color:#eef1ff;background:#111624;border:1px solid #39445a;border-radius:9px;padding:10px;font:inherit;width:100%}.channel-head{display:flex;justify-content:space-between;align-items:center;margin-top:26px;margin-bottom:12px}.channel-head strong{font-size:14px}.notice{font-size:13px;background:#292c24;color:#e8d6a0;border:1px solid #58533a;border-radius:10px;padding:12px 14px;margin:14px 0}.channels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.channel{padding:12px;display:flex;align-items:center;gap:12px;border-radius:10px;border:1px solid #333d51;background:#141a27;cursor:pointer}.channel:hover{border-color:#6882c1}.channel:has(input:checked){border-color:#7a8bf8;background:#212b48}.channel input{accent-color:#788bff;width:17px;height:17px;cursor:pointer}.channel span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.channel small{color:#8c9bb7;font-size:11px;margin-left:auto}.channel.locked{opacity:.45;cursor:not-allowed}.actions{display:flex;align-items:center;justify-content:space-between;margin-top:20px;gap:15px}.counter{color:#9cb0dd;font-size:13px}.empty{color:#9eabc3;padding:20px 0}.foot{margin-top:28px;color:#828ca5;font-size:12px;line-height:1.8}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#c7f7df;color:#123b2d;padding:12px 22px;border-radius:11px;box-shadow:0 12px 30px #0009;font-weight:700;display:none;white-space:nowrap}.toast.error{background:#ffd0d0;color:#651b1b}.guild-drawer{padding:0;overflow:hidden}.guild-drawer>summary{list-style:none;cursor:pointer;padding:21px 23px;user-select:none}.guild-drawer>summary::-webkit-details-marker{display:none}.guild-drawer>summary:hover{background:#222b3b}.guild-drawer>summary:focus-visible{outline:2px solid #8599ff;outline-offset:-3px}.guild-drawer .guild-toggle{display:flex;align-items:center;gap:12px}.guild-drawer .chevron{display:inline-block;font-size:22px;line-height:1;color:#a5b5d5;transition:transform .16s ease}.guild-drawer[open] .chevron{transform:rotate(90deg)}.guild-drawer .guild-body{border-top:1px solid #313b4e;padding:0 23px 23px}
@media(max-width:650px){.shell{padding:18px 13px 50px}.top{align-items:flex-start;flex-direction:column}.hero{padding:21px}.panel{padding:16px}.channels{grid-template-columns:1fr}.formrow{grid-template-columns:1fr}.guild-drawer{padding:0}.guild-drawer>summary{padding:16px}.guild-drawer .guild-body{padding:0 16px 16px}}
</style>
</head>
<body><main class="shell">
<div class="top"><div class="brand"><div class="logo">🤖</div><div><div class="eyebrow">LOCAL AI CONTROL</div><h1>Discord AI Bot</h1></div></div><div class="status"><span id="discord" class="pill">Discord 檢查中</span><span id="ollama" class="pill">Ollama 檢查中</span></div></div>
<section class="hero"><h2>頻道由你決定</h2><p>Bot 會自動讀取它有權限查看的文字頻道。<strong>預設全部不勾選，也不會自動回覆。</strong>選擇頻道並按儲存後，才開始在那些頻道使用 Discord 原生回覆。歷史訊息只當作上下文，不會補回舊訊息。</p></section>
<div class="sectionTitle"><h2>AI 模型</h2></div><section class="panel"><div class="panel-head"><label class="field" style="flex:1"><span>Ollama 模型</span><select id="model"><option value="qwen3.5:35b-a3b">Qwen3.5 · 35B-A3B（主力）</option><option value="qwen3.5:9b">Qwen3.5 · 9B（較輕量）</option></select></label><button class="btn primary" onclick="saveModel()">儲存模型</button></div></section>
<div class="sectionTitle"><h2>伺服器與頻道</h2><button class="btn" id="refresh" onclick="refresh()">↻ 重新整理頻道</button></div>
<div id="guilds"><div class="empty">正在讀取 Discord 伺服器…</div></div>
<div class="foot">管理介面僅綁定 127.0.0.1，請用 SSH 轉發開啟。密碼只儲存在伺服器本機。頻道清單以 Bot 實際權限為準；沒有發言權限的頻道不可勾選。每個伺服器的設定分開儲存。</div>
</main><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);let guildData=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer;
function showToast(msg,error=false){const el=$('#toast');el.textContent=msg;el.className='toast'+(error?' error':'');el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',3800)}
async function api(url,options={}){const res=await fetch(url,{cache:'no-store',...options,headers:{'X-Admin-Request':'1',...(options.headers||{})}});if(!res.ok)throw new Error('HTTP '+res.status+'：'+(await res.text()).slice(0,150));return res.json()}
async function refresh(){try{const [data,health]=await Promise.all([api('/api/guilds'),api('/api/health')]);guildData=data.guilds;$('#model').value=data.model;setPill('#discord',health.discord?'Discord 已連線':'Discord 未連線',health.discord);setPill('#ollama',health.ollama?'Ollama 正常':'Ollama 未連線',health.ollama);renderGuilds()}catch(e){showToast('載入失敗：'+e.message,true);$('#guilds').innerHTML='<div class="empty">無法載入頻道。請檢查 Bot 是否在線。</div>'}}
function setPill(sel,text,ok){const e=$(sel);e.textContent=text;e.className='pill '+(ok?'good':'bad')}
function renderGuilds(){const root=$('#guilds');const opened=new Set([...root.querySelectorAll('details[data-guild][open]')].map(p=>p.dataset.guild));if(!guildData.length){root.innerHTML='<div class="panel empty">目前沒有伺服器。請確認 Bot 已加入伺服器，而且程式已成功登入。</div>';return}root.innerHTML=guildData.map(g=>{let cfg=g.settings||{mode:'selected',channels:[],history_limit:50};let set=new Set(cfg.channels.map(String));return `<details class="panel guild-drawer" name="discord-guild" data-guild="${esc(g.id)}" ${opened.has(String(g.id))?'open':''}><summary class="panel-head"><div><div class="guildname">${esc(g.name)}</div><div class="sub">${esc(g.id)} · ${g.channels.length} 個可見文字頻道</div></div><span class="guild-toggle"><span class="pill">${set.size} 個已啟用</span><span class="chevron" aria-hidden="true">›</span></span></summary><div class="guild-body"><div class="formrow"><label class="field">回覆模式<select class="mode"><option value="selected" ${cfg.mode==='selected'?'selected':''}>指定頻道自動回覆（預設）</option><option value="mentions" ${cfg.mode==='mentions'?'selected':''}>只有 @Bot 或 /chat</option><option value="hybrid" ${cfg.mode==='hybrid'?'selected':''}>指定頻道自動回覆，其他頻道需 @Bot</option></select></label><label class="field">讀取歷史訊息數量<input class="history" type="number" min="0" max="100" value="${Number(cfg.history_limit)}"></label></div><div class="channel-head"><strong>可見頻道</strong><span class="muted">新頻道預設不勾選</span></div><div class="channels">${g.channels.length?g.channels.map(c=>`<label class="channel ${c.can_send?'':'locked'}"><input type="checkbox" value="${esc(c.id)}" ${set.has(c.id)&&c.can_send?'checked':''} ${c.can_send?'':'disabled'}><span># ${esc(c.name)}</span>${c.can_send?'': '<small>無發言權</small>'}</label>`).join(''):'<div class="empty">沒有 Bot 可查看的文字頻道</div>'}</div><div class="notice">⚠ 沒有勾選任何頻道時，預設模式不會自動回覆任何訊息。</div><div class="actions"><span class="counter">已選 0 個頻道</span><button class="btn primary" onclick="saveGuild('${esc(g.id)}')">儲存頻道設定</button></div></div></details>`}).join('');document.querySelectorAll('[data-guild]').forEach(p=>{const update=()=>p.querySelector('.counter').textContent=`已選 ${p.querySelectorAll('input[type=checkbox]:checked').length} 個頻道`;p.querySelectorAll('input[type=checkbox]').forEach(el=>el.addEventListener('change',update));update()})}
async function saveGuild(id){const p=document.querySelector(`[data-guild="${id}"]`);const body={guild_id:id,mode:p.querySelector('.mode').value,history_limit:Number(p.querySelector('.history').value),channels:[...p.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value)};try{await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});showToast('已儲存！所選頻道立即生效。');await refresh()}catch(e){showToast('儲存失敗：'+e.message,true)}}
async function saveModel(){try{await api('/api/model',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:$('#model').value})});showToast('模型設定已更新！')}catch(e){showToast('儲存失敗：'+e.message,true)}}
refresh();
</script></body></html>
